[package]
name = "baton"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
