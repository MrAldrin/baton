name: Release

# Push a tag such as v0.1.0 to build ready-to-use binaries and attach them to
# a GitHub Release. No Rust toolchain or C++ build tools are needed to use them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: one static binary that runs on any x86_64 Linux and WSL,
          # independent of the distribution's glibc version.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          # Static C runtime: no Visual C++ redistributable needed.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (binary, skill, README)
        shell: bash
        run: |
          name="baton-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then exe=baton.exe; else exe=baton; fi
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp -r skills README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "baton $GITHUB_REF_NAME" \
            --notes "Ready-to-use binaries with the using-baton skill. Linux/WSL: x86_64-unknown-linux-musl (static). Windows: x86_64-pc-windows-msvc (static C runtime). Install steps: README.md."
